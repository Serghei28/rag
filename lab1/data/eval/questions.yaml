      В 2000–2016 годах президента избирал парламент тайным голосованием депутатов.
      В 2016 году Конституционный суд признал эту поправку неконституционной, и президента
      снова избирают прямым всенародным голосованием.
    relevant_titles: [Молдова]
    relevant_sections: [Государственное устройство > Президент]

