# Базовая конфигурация pipeline.
# Конфиги экспериментов будут переопределять отдельные параметры этого файла.

paths:
  data_dir: data
  raw_dir: data/raw              # сырые документы от grabber'а
  processed_dir: data/processed  # очищенные документы и chunks
  index_dir: data/index          # векторное хранилище
  experiments_dir: experiments   # результаты экспериментов

# Предметная область: государство и право Республики Молдова (русская Википедия).
grabber:
  api_url: https://ru.wikipedia.org/w/api.php
  categories:
    - { name: Право Молдовы, depth: 2 }
    - { name: Государственное устройство Молдовы, depth: 2 }
    - { name: Политика Молдовы, depth: 1 }
    - { name: Парламентские выборы в Молдове, depth: 1 }
    - { name: Президентские выборы в Молдове, depth: 1 }
    - { name: Государственные символы Молдовы, depth: 1 }
    - { name: Административное деление Молдовы, depth: 1 }
  titles:
    - Молдова
    - Конституция Молдовы
    - Парламент Республики Молдова
    - Президент Республики Молдова
    - Правительство Республики Молдова
    - Конституционный суд Республики Молдова
    - Гагаузия
    - Приднестровский конфликт
    - Молдавский язык
  # Подкатегории, которые не обходим: биографии и сотни статей о сёлах
  exclude_categories:
    - Персоналии
    - Юристы
    - Политики
    - Депутаты
    - Предприниматели
    - по годам
    - по десятилетиям
    - по городам
    - Административные единицы
    - Районы городов
  exclude_titles:
    - Чемпионат
    - футбол
    - "^Список "
  max_pages: 400
  request_delay: 0.1

preprocessing:
  drop_sections: [Примечания, Комментарии, Ссылки, Литература, Источники, См. также, Галерея]
  keep_infobox: true
  keep_tables: true

# Все стратегии строятся командой `pixi run preprocess`.
# Одинаковый целевой размер (800 символов ≈ 200 токенов) — чтобы сравнивать именно способ
# разбиения, а не размер. Размеры и overlap варьируются в конфигах экспериментов.
chunking:
  - { name: fixed_800, method: fixed, size: 800 }
  - { name: fixed_800_ov150, method: fixed, size: 800, overlap: 150 }
  - { name: paragraph_800, method: paragraph, size: 800 }
  - { name: section_800, method: section, size: 800 }

# Каждая пара (модель × стратегия chunking) индексируется в свою коллекцию Qdrant.
embeddings:
  models:
    - name: e5-base
      model_id: intfloat/multilingual-e5-base
      query_prefix: "query: "
      passage_prefix: "passage: "
      max_seq_length: 512
    - name: bge-m3
      model_id: BAAI/bge-m3
      max_seq_length: 1024
  batch_size: 32
  device: auto
  with_header: true

# Комбинация по умолчанию для поиска и генерации (выбор обоснуется экспериментами).
active:
  embedding: bge-m3
  chunking: section_800
