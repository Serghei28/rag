[project]
name = "rag-md"
version = "0.1.0"
description = "RAG-система по государству и праву Республики Молдова (лабораторная работа №1)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "langfuse>=5.0,<6",
  "tenacity>=8.5",
  "typer>=0.12",
  "rich>=13.7",
]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
rag = "rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

# ---------------------------------------------------------------- pixi ---

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
rag-md = { path = ".", editable = true }

[tool.pixi.activation.env]
# Русский текст в консоли Windows без кракозябр
PYTHONUTF8 = "1"
PYTHONIOENCODING = "utf-8"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
check = { cmd = "rag check", description = "Проверить окружение: конфиг, GPU, Langfuse, Ollama" }
grab = { cmd = "rag grab", description = "Скачать новые и изменённые статьи в data/raw" }
preprocess = { cmd = "rag preprocess", description = "Очистка и chunking: data/raw → data/processed" }
test = { cmd = "pytest", description = "Запустить тесты" }
lint = { cmd = "ruff check src tests", description = "Проверить код линтером" }
fmt = { cmd = "ruff format src tests", description = "Отформатировать код" }
export-requirements = { cmd = "python scripts/export_requirements.py", description = "Обновить requirements.txt из pyproject.toml" }

# ---------------------------------------------------------------- tools ---

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # HTML-фикстуры и параметры тестов удобнее держать одной строкой
